name: Week14 PPO verified convergence

on:
  push:
    branches:
      - chatgpt/week14-ppo-20260830
    paths:
      - .github/workflows/week14_ppo_verified.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: PPO verified 5M
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y swig ffmpeg
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install 'gymnasium[box2d]' stable-baselines3 sb3-contrib 'imageio[ffmpeg]' pandas matplotlib
      - name: Restore benchmark script
        run: |
          base64 -d experiments/week14_ppo/train_week14_ppo_verified.py.gz.b64 | gzip -d > /tmp/train_week14_ppo_verified.py
          python -m py_compile /tmp/train_week14_ppo_verified.py
      - name: Train and evaluate PPO
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          python /tmp/train_week14_ppo_verified.py \
            --algorithm ppo \
            --seed 42 \
            --output week14_verified_results \
            --total-timesteps 5000000 \
            --max-wall-seconds 6000 \
            --eval-every-steps 100000 \
            --eval-episodes 10 \
            --final-eval-episodes 50 \
            --n-envs 32
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week14-ppo-verified
          path: week14_verified_results/ppo_seed42
          if-no-files-found: warn
          retention-days: 7
